      duplicate/invalid/unknown-reference/late/conflicting 收件均可查看且不覆盖已确定事实 - AND
      到期、重试与成功后禁建新 attempt 的可执行状态来自统一资源动作
    result: passed
    reason:
      text: 支付页以统一结构化流程创建 Payment、创建/提交 attempt、接收可信结果并分层展示
        receipts/Operation/finality；终态仍允许 duplicate/late/conflicting 收件但不重新开放
        attempt。真实 WOW/CAP4K live smoke 验证成功、冲突不回退首个成功、通知/timeline 和单支付到期关闭。
